[package]
name = "autosynth-lower"
version = "0.1.0"
edition = "2024"

[features]
trace = ["serde_json", "serde", "autosynth-ir/trace", "autosynth-isa/trace"]

[dependencies]
autosynth-ir = { path = "../autosynth-ir" }
autosynth-isa = { path = "../autosynth-isa" }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
